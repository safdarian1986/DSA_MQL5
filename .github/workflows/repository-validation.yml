name: DSA-MQL5 Repository Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  repository-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate repository baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $requiredFiles = @(
            'README.md',
            'DSA_MQL5_Native.mq5',
            'DSA_MQL5_Native.ex5',
            'Core/DSACommon.mqh',
            'Core/InputContract.mqh',
            'Core/StateRegistry.mqh',
            'Runtime/TickScheduler.mqh',
            'Data/DataContract.mqh',
            'Data/MTFAlignment.mqh',
            'Features/FeatureEngine.mqh',
            'Models/ModelBank.mqh',
            'Adaptation/AdaptiveEngine.mqh',
            'Validation/ValidationEngine.mqh',
            'Events/EventEngine.mqh',
            'Visual/VisualRenderer.mqh',
            'Stations/StationManifest.mqh',
            'Catalog/DSA_MQL5_EN.docx',
            'Catalog/DataSience-en.docx',
            'Validation/IMPLEMENTATION_REPORT.md',
            'Validation/CATALOG_SPECIFICATION_AUDIT.md',
            'Validation/COMPLETION_AUDIT.md',
            'Validation/CATALOG_CLAUSE_MATRIX.md',
            'Validation/DSA_AdversarialHarness.mq5',
            'Validation/DSA_MtfCausalityHarness.mq5',
            'Validation/DSA_ChartObjectHarness.mq5',
            'Validation/DSA_ModelModeHarness.mq5',
            'Validation/DSA_SelectionDataHarness.mq5',
            'Validation/DSA_AnalysisTimeframeHarness.mq5',
            'Validation/DSA_StateIsolationHarness.mq5',
            'Validation/DSA_DisplayStateHarness.mq5',
            'Validation/DSA_HistoryRevisionHarness.mq5',
            'Validation/DSA_RuntimeHarness.mq5',
            'Validation/DSA_DeepLearningHarness.mq5',
            'Validation/RuntimeTesterAdversarial.ini',
            'Validation/RuntimeTesterMtf.ini',
            'Validation/RuntimeTesterChart.ini',
            'Validation/RuntimeTesterModes.ini',
            'Validation/RuntimeTesterSelection.ini',
            'Validation/RuntimeTesterAnalysisTimeframe.ini',
            'Validation/RuntimeTesterState.ini',
            'Validation/RuntimeTesterDisplay.ini',
            'Validation/RuntimeTesterHistoryRevision.ini',
            'Validation/RuntimeTester.ini',
            'Validation/RuntimeTesterDeep.ini'
          )

          foreach ($path in $requiredFiles) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Missing required project file: $path"
            }
          }

          $requiredDirectories = @(
            'Catalog',
            'Core',
            'Runtime',
            'Data',
            'Features',
            'Models',
            'Adaptation',
            'Validation',
            'Events',
            'Visual',
            'Stations'
          )

          foreach ($path in $requiredDirectories) {
            if (-not (Test-Path -LiteralPath $path -PathType Container)) {
              throw "Missing required project directory: $path"
            }
          }

          $inputMatches = Select-String -LiteralPath 'DSA_MQL5_Native.mq5' -Pattern '^input '
          if ($inputMatches.Count -ne 10) {
            throw "Expected exactly 10 official input declarations, found $($inputMatches.Count)"
          }

          $indicatorHeader = Get-Content -LiteralPath 'DSA_MQL5_Native.mq5' -Raw
          if ($indicatorHeader -notmatch '#property\s+indicator_plots\s+10') {
            throw 'Expected exactly 10 indicator plots.'
          }

          if ($indicatorHeader -notmatch '#property\s+indicator_buffers\s+30') {
            throw 'Expected 30 mapped indicator buffers, including calculation buffers.'
          }

          if ($indicatorHeader -notmatch 'CalcBarFingerprint' -or $indicatorHeader -notmatch 'DSA_AuditHistoricalRevisionSlice') {
            throw 'Expected per-bar history revision audit support in the indicator source.'
          }

          $dataContract = Get-Content -LiteralPath 'Data/DataContract.mqh' -Raw
          if ($dataContract -notmatch 'DSASelectionChannels' -or $dataContract -notmatch 'DSA_BuildSelectionChannels') {
            throw 'Expected independent selection-channel contract support.'
          }

          $historyRevisionHarness = Get-Content -LiteralPath 'Validation/DSA_HistoryRevisionHarness.mq5' -Raw
          if ($dataContract -notmatch 'DSA_FingerprintBufferMatchesCurrent' -or
              $dataContract -notmatch 'DSA_BarRevisionFingerprint' -or
              $indicatorHeader -notmatch 'DSA_FingerprintBufferMatchesCurrent' -or
              (Get-Content -LiteralPath 'Runtime/TickScheduler.mqh' -Raw) -notmatch 'DSA_BuildInProgressMatches' -or
              $historyRevisionHarness -notmatch 'HistoryFingerprintChangedOk' -or
              $historyRevisionHarness -notmatch 'UnsampledCandidateRejectedOk') {
            throw 'Expected revised-history runtime proof and stale-candidate fingerprint guard support.'
          }

          $mtfContract = Get-Content -LiteralPath 'Data/MTFAlignment.mqh' -Raw
          $featureEngine = Get-Content -LiteralPath 'Features/FeatureEngine.mqh' -Raw
          if ($mtfContract -notmatch 'DSA_GetPrimaryAnalysisSnapshot' -or
              $mtfContract -notmatch 'DSA_ShouldRunMediumPath' -or
              $mtfContract -notmatch 'DSA_IsAnalysisCommitHostBar' -or
              $featureEngine -notmatch 'primary_analysis_available' -or
              $featureEngine -notmatch 'DSA_GetPrimaryAnalysisSnapshot') {
            throw 'Expected Analysis Timeframe to feed the primary feature path and Medium Path commit trigger.'
          }

          $prepareIndex = $indicatorHeader.IndexOf('DSA_PrepareBackgroundBuild(rates_total,history_fingerprint);')
          $closedCommitIndex = $indicatorHeader.IndexOf('DSA_ProcessAnalysisCommitBar(1,rates_total,time,open,high,low,close,tick_volume,spread);')
          $liveIndex = $indicatorHeader.IndexOf('DSA_ProcessLivePath(rates_total,time,open,high,low,close,tick_volume,spread);')
          $sliceIndex = $indicatorHeader.IndexOf('DSA_ProcessHistoricalSlice(rates_total,time,open,high,low,close,tick_volume,spread);')
          if ($prepareIndex -lt 0 -or $closedCommitIndex -lt 0 -or $liveIndex -lt 0 -or $sliceIndex -lt 0 -or
              $prepareIndex -gt $closedCommitIndex -or $closedCommitIndex -gt $liveIndex -or $liveIndex -gt $sliceIndex) {
            throw 'Expected OnCalculate to run lightweight build preparation, Analysis Bar commit, P0 live path, then historical background slices.'
          }

          if ($indicatorHeader -notmatch 'DSA_RetainedOutputAvailable' -or
              $indicatorHeader -notmatch 'DSA_CandidateBuildActive' -or
              $indicatorHeader -notmatch 'DSA_CommitCandidateBuffers' -or
              $indicatorHeader -notmatch 'DSA_CandidateBuildMatches' -or
              $indicatorHeader -notmatch 'DSA_CandidateRejected') {
            throw 'Expected retained-output candidate build, stale-candidate guard, and atomic commit support.'
          }

          $stateRegistry = Get-Content -LiteralPath 'Core/StateRegistry.mqh' -Raw
          if ($stateRegistry -notmatch 'struct DSAClosedState' -or
              $stateRegistry -notmatch 'struct DSALiveState' -or
              $stateRegistry -notmatch 'DSA_BeginLiveState' -or
              $stateRegistry -notmatch 'DSA_LiveStateUsesClosedBase') {
            throw 'Expected explicit ClosedState and LiveState registry support.'
          }

          if ($indicatorHeader -notmatch 'DSA_CommitClosedStateFromMainBuffers' -or
              $indicatorHeader -notmatch 'DSA_BeginLiveStateFromClosed' -or
              $indicatorHeader -notmatch 'DSA_CaptureLiveStateFromMainBuffers') {
            throw 'Expected indicator to commit ClosedState and derive LiveState from it.'
          }

          $displayHarness = Get-Content -LiteralPath 'Validation/DSA_DisplayStateHarness.mq5' -Raw
          if ($displayHarness -notmatch 'HiddenHistoryOk' -or
              $displayHarness -notmatch 'ForecastHiddenOk' -or
              $displayHarness -notmatch 'EventsHiddenOk' -or
              $indicatorHeader -notmatch 'if\(!InputContract\.historical_display && !live_bar\)' -or
              $indicatorHeader -notmatch 'if\(InputContract\.event_display\)' -or
              (Get-Content -LiteralPath 'Visual/VisualRenderer.mqh' -Raw) -notmatch 'if\(!contract\.forecast_display\)') {
            throw 'Expected display toggles to hide only graphical output while core buffers continue.'
          }

          $mqlFiles = Get-ChildItem -Recurse -Force -File -Include '*.mq5','*.mqh' |
            Where-Object { $_.FullName -notmatch '[\\/]\.git[\\/]' }

          $forbiddenPattern = 'OrderSend|OrderSendAsync|CTrade|PositionSelect|PositionGet|WebRequest|#import|Socket|Wininet|kernel32|shell32|EventSetTimer|OnTimer|UpdateInterval|Python'
          foreach ($file in $mqlFiles) {
            $content = Get-Content -LiteralPath $file.FullName -Raw
            if ($content -match $forbiddenPattern) {
              throw "Forbidden trading, timer, or external dependency marker found in $($file.FullName)"
            }
          }

          foreach ($file in $mqlFiles) {
            $content = Get-Content -LiteralPath $file.FullName -Raw
            if ($content -match 'neural|LSTM|GRU|TCN|Transformer|Multi-Scale Sequence') {
              throw "Undefined neural or sequence-model implementation marker found in $($file.FullName)"
            }
          }

          $textFiles = @()
          $textFiles += Get-ChildItem -Recurse -Force -File -Include '*.mq5','*.mqh','*.md','*.ini','*.yml','*.yaml' |
            Where-Object { $_.FullName -notmatch '[\\/]\.git[\\/]' }
          $textFiles += Get-Item -LiteralPath '.gitignore' -Force

          foreach ($file in $textFiles) {
            $content = Get-Content -LiteralPath $file.FullName -Raw
            if ($content -match '[^\x00-\x7F]') {
              throw "Non-ASCII project-owned text found in $($file.FullName)"
            }
          }

          $compileLogs = Get-ChildItem -File -Filter 'compile-evidence-*.log'
          if ($compileLogs.Count -lt 9) {
            throw "Expected at least 9 retained compile evidence logs, found $($compileLogs.Count)"
          }

          foreach ($log in $compileLogs) {
            $content = Get-Content -LiteralPath $log.FullName -Raw
            if ($content -notmatch 'Result:\s+0 errors,\s+0 warnings') {
              throw "Compile evidence log does not report 0 errors and 0 warnings: $($log.Name)"
            }
          }

          $audit = Get-Content -LiteralPath 'Validation/COMPLETION_AUDIT.md' -Raw
          if ($audit -notmatch 'IN PROGRESS') {
            throw 'Completion audit must preserve the current in-progress readiness status.'
          }

          if ($audit -notmatch 'lightweight native sequence expert' -or
              $audit -notmatch 'Independent Selection Data channels' -or
              $audit -notmatch 'Fast Path priority' -or
              $audit -notmatch 'Analysis Timeframe primary path') {
            throw 'Completion audit must preserve the owner-resolved Deep/Hybrid roadmap, Selection Data, Fast Path, and Analysis Timeframe status.'
          }
